name: ci-web

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-web.yml"
      - "web/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login a GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build e push dell'immagine
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-web
          # Due tag: lo SHA identifica la versione (rollback, deploy precisi), latest e' comodo a mano.
          docker build -t $IMAGE:$GITHUB_SHA -t $IMAGE:latest ./web
          docker push $IMAGE:$GITHUB_SHA
          docker push $IMAGE:latest

  deploy:
    needs: web
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy su Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB }}
        run: |
          # imgURL: Render usa l'immagine con lo SHA di questo commit invece di riscaricare latest.
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}-web:$GITHUB_SHA"
          curl -fsS -X POST "$HOOK&imgURL=$(jq -rn --arg v "$IMAGE" '$v|@uri')"
