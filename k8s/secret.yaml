# Password e connection string. In un Secret, non nel manifest del Deployment:
# chi puo' leggere i Deployment non per forza puo' leggere i Secret (RBAC).
# Attenzione: stringData viene solo codificato in base64, non cifrato.
apiVersion: v1
kind: Secret
metadata:
  name: shipboard-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: solo-per-il-lab
  ConnectionStrings__shipboard: Host=db;Port=5432;Database=shipboard;Username=shipboard;Password=solo-per-il-lab
