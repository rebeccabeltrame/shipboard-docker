# Frontend: nginx serve Angular e inoltra /api al Service "api".
apiVersion: v1
kind: ConfigMap
metadata:
  name: shipboard-config
data:
  API_URL: http://api:8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipboard-web
  labels:
    app: shipboard-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipboard-web
  template:
    metadata:
      labels:
        app: shipboard-web
    spec:
      containers:
        - name: web
          image: ghcr.io/matteobortolazzo/shipboard-docker-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: API_URL
              valueFrom:
                configMapKeyRef:
                  name: shipboard-config
                  key: API_URL
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: shipboard-web
  ports:
    - port: 8080
---
# Ingress: Traefik (incluso in k3s) porta il traffico da fuori al Service "web".
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shipboard
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 8080
