# API ShipBoard: l'immagine pubblicata dalla CI su GHCR.
# Per usare la vostra: cambiate "matteobortolazzo" con il vostro utente GitHub (minuscolo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipboard-api
  labels:
    app: shipboard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shipboard-api
  template:
    metadata:
      labels:
        app: shipboard-api
    spec:
      containers:
        - name: api
          image: ghcr.io/matteobortolazzo/shipboard-docker-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__shipboard
              valueFrom:
                secretKeyRef:
                  name: shipboard-secrets
                  key: ConnectionStrings__shipboard
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          # ESERCIZIO (probe): togliete i commenti e spiegate la differenza tra le due.
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   periodSeconds: 5
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 8080
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: shipboard-api
  ports:
    - port: 8080
